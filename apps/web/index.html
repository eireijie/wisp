<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wisp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Wisp</title>
    <script src="/storage-migration.js"></script>
    <script>
      // pick the mode and theme before first paint (theme.ts takes over once the app loads)
      (function () {
        var m, t;
        try {
          m = localStorage.getItem("wisp.mode");
          t = localStorage.getItem("wisp.theme");
        } catch (e) {}
        if (t === "light" || t === "dark") (m = t), (t = null); // older choice, migrated by theme.ts
        if (m !== "light" && m !== "dark") m = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var root = document.documentElement;
        root.dataset.mode = m;
        root.dataset.theme = t || "mono";
        try {
          var s = localStorage.getItem("wisp.textSize");
          root.dataset.text = s === "small" || s === "large" ? s : "default";
          if (localStorage.getItem("wisp.motion") === "reduce") root.dataset.motion = "reduce";
        } catch (e) {}
        if (m === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0d0d0d");
      })();
    </script>
    <style>
      html { background: #fff; color: #a3a3a3; }
      html[data-mode="dark"] { background: #0d0d0d; color: #6b6b6b; }
    </style>
  </head>
  <body>
    <div id="root">
      <div role="status" style="position: fixed; inset: 0; display: grid; place-items: center">
        <svg viewBox="22 10 76 104" width="88" height="88" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path class="loader-draw" pathLength="100" d="M30 60 C30 32 44 18 60 18 C76 18 90 32 90 60 L90 96 Q85 104 80 96 Q75 88 70 96 Q65 104 60 96 Q55 88 50 96 Q45 104 40 96 Q35 88 30 96 Z" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
