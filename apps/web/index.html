<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wisp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Wisp</title>
    <script src="/storage-migration.js"></script>
    <script>
      // pick the mode and theme before first paint (theme.ts takes over once the app loads)
      (function () {
        var m, t;
        try {
          m = localStorage.getItem("wisp.mode");
          t = localStorage.getItem("wisp.theme");
        } catch (e) {}
        if (t === "light" || t === "dark") (m = t), (t = null); // older choice, migrated by theme.ts
        if (m !== "light" && m !== "dark") m = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var root = document.documentElement;
        root.dataset.mode = m;
        root.dataset.theme = t || "mono";
        try {
          var s = localStorage.getItem("wisp.textSize");
          root.dataset.text = s === "small" || s === "large" ? s : "default";
          if (localStorage.getItem("wisp.motion") === "reduce") root.dataset.motion = "reduce";
        } catch (e) {}
        if (m === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#111113");
      })();
    </script>
    <style>
      html { background: #fff; color: #a3a3a3; }
      html[data-mode="dark"] { background: #111113; color: #6b6b6b; }
    </style>
  </head>
  <body>
    <div id="root">
      <div role="status" style="position: fixed; inset: 0; display: grid; place-items: center">
        <svg viewBox="12 2 76 92" width="88" height="88" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path class="loader-draw" pathLength="100" d="M48 88 C30 88 19 75 19 60 C19 44 31 35 44 31 C57 27 68 20 78 7 C81 22 83 36 81 52 C79 74 66 88 48 88Z" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
