<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>Screen Code</title>
<style>
  :root {
    --panel: #ffffff; --card: #f2f2f5; --control: #ffffff; --control-line: rgb(0 0 0 / 0.12);
    --ink: #17171a; --muted: #5f5f68; --faint: #8a8a94; --line: rgb(0 0 0 / 0.08);
    --accent: #17171a; --accent-ink: #fafafa; --chip: #e9e9ee; --tile: #e6e6eb; --bad: #c9372c; --link: #0a6fe0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --panel: #18181b; --card: #26262a; --control: #2a2a2e; --control-line: rgb(255 255 255 / 0.1);
      --ink: #f2f2f4; --muted: #a1a1aa; --faint: #8e8e96; --line: rgb(255 255 255 / 0.07);
      --accent: #f2f2f4; --accent-ink: #111113; --chip: #2a2a2e; --tile: #2e2e32; --bad: #ff6b6b; --link: #9ec5ff;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--panel); color: var(--ink); padding: 28px 30px 22px;
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
  }
  form { display: flex; flex-direction: column; gap: 14px; }
  .head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
  .tile { width: 52px; height: 52px; border-radius: 12px; background: var(--tile); display: grid; place-items: center; }
  .tile svg { width: 26px; height: 26px; }
  h1 { font-size: 22px; font-weight: 600; margin: 4px 0 0; letter-spacing: -0.02em; }
  .head p { margin: 0; color: var(--muted); }
  .kinds { display: flex; gap: 4px; background: var(--card); border-radius: 999px; padding: 4px; }
  .kinds button { flex: 1; border: 0; background: none; color: var(--muted); height: 34px; border-radius: 999px; box-shadow: none; font-weight: 500; }
  .kinds button[aria-pressed="true"] { background: var(--control); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.18); }
  button { font: inherit; font-weight: 500; cursor: pointer; }
  label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
  label span { padding-left: 6px; }
  input {
    font: inherit; font-size: 15px; width: 100%; height: 44px; padding: 0 16px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); outline: none;
  }
  input::placeholder { color: var(--faint); }
  input:focus { border-color: var(--faint); }
  :focus-visible { outline: 2px solid #0a84ff; outline-offset: 3px; }
  .error { color: var(--bad); min-height: 20px; margin: -4px 6px 0; }
  .primary { height: 46px; border-radius: 23px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 15px; }
  .link { background: none; border: 0; color: var(--link); font-weight: 500; font-size: 15px; height: 40px; }
  .link:hover { text-decoration: underline; }
  .actions { display: flex; flex-direction: column; gap: 2px; }
</style>
</head>
<body>
<form id="form">
  <div class="head">
    <span class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
    <h1 id="title">Pick a code for this screen</h1>
    <p>Opening this screen from Wisp needs this code. It stays on this computer.</p>
  </div>
  <div class="kinds" role="group" aria-label="Kind of code">
    <button type="button" data-kind="pin" aria-pressed="true">6-digit PIN</button>
    <button type="button" data-kind="password" aria-pressed="false">Password</button>
  </div>
  <label for="code"><span id="codeLabel">New PIN</span>
    <input id="code" type="password" autocomplete="new-password" inputmode="numeric" maxlength="6" placeholder="6 digits" autofocus />
  </label>
  <label for="again"><span>Type it again</span>
    <input id="again" type="password" autocomplete="new-password" inputmode="numeric" maxlength="6" placeholder="Same PIN" />
  </label>
  <div class="error" id="error" role="alert"></div>
  <div class="actions">
    <button type="submit" class="primary">Save code</button>
    <button type="button" class="link" id="cancel">Cancel</button>
  </div>
</form>
<script>
  const state = JSON.parse(new URLSearchParams(location.search).get("state") || "{}");
  if (state.change) document.getElementById("title").textContent = "Change the screen code";
  let kind = "pin";
  const code = document.getElementById("code");
  const again = document.getElementById("again");
  const error = document.getElementById("error");
  for (const b of document.querySelectorAll("[data-kind]"))
    b.addEventListener("click", () => {
      kind = b.dataset.kind;
      for (const o of document.querySelectorAll("[data-kind]")) o.setAttribute("aria-pressed", String(o === b));
      document.getElementById("codeLabel").textContent = kind === "pin" ? "New PIN" : "New password";
      for (const i of [code, again]) {
        i.value = "";
        i.inputMode = kind === "pin" ? "numeric" : "text";
        if (kind === "pin") i.maxLength = 6;
        else i.removeAttribute("maxlength");
      }
      code.placeholder = kind === "pin" ? "6 digits" : "At least 8 characters";
      again.placeholder = kind === "pin" ? "Same PIN" : "Same password";
      error.textContent = "";
      code.focus();
    });
  document.getElementById("cancel").addEventListener("click", () => window.close());
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const r = await window.wispScreenCode.save({ kind, code: code.value, again: again.value });
    if (r?.error) {
      error.textContent = r.error;
      again.value = "";
      (r.error.includes("match") ? again : code).focus();
    }
  });
</script>
</body>
</html>
