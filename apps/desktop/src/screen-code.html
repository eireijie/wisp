<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>Screen Code</title>
<style>
  :root {
    --app: #f7f7f7; --panel: #fff; --ink: #1b1b1b; --muted: #777; --input: #dadada; --chip: #f1f1f1;
    --accent: #1f1f1f; --accent-ink: #fcfcfc; --bad: #c9372c;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --app: #1f1f1f; --panel: #141414; --ink: #f4f4f4; --muted: #a8a8a8; --input: rgb(255 255 255 / 0.14);
      --chip: rgb(255 255 255 / 0.075); --accent: #f4f4f4; --accent-ink: #141414; --bad: #ff7a6b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--app); color: var(--ink); padding: 20px 22px;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 16px; font-weight: 650; margin: 0 0 4px; }
  p { margin: 0 0 14px; color: var(--muted); }
  .kinds { display: flex; gap: 4px; background: var(--chip); border-radius: 9px; padding: 3px; margin-bottom: 12px; }
  .kinds button { flex: 1; border: 0; background: none; color: var(--muted); padding: 5px; }
  .kinds button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
  button {
    font: inherit; font-weight: 550; border-radius: 8px; padding: 7px 14px; cursor: pointer;
    border: 1px solid var(--input); background: var(--panel); color: var(--ink);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  label { display: block; font-weight: 550; margin-bottom: 4px; }
  input {
    font: inherit; width: 100%; padding: 7px 10px; border-radius: 8px; margin-bottom: 10px;
    border: 1px solid var(--input); background: var(--panel); color: var(--ink); outline: none;
  }
  input:focus { border-color: var(--ink); }
  .error { color: var(--bad); min-height: 21px; margin: 0 0 8px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<form id="form">
  <h1 id="title">Pick a code for this screen</h1>
  <p>Opening this screen from Warren, lending it to agents, and approving their requests to borrow it all need this code. It stays on this computer.</p>
  <div class="kinds" role="group" aria-label="Kind of code">
    <button type="button" data-kind="pin" aria-pressed="true">6-digit PIN</button>
    <button type="button" data-kind="password" aria-pressed="false">Password</button>
  </div>
  <label for="code" id="codeLabel">New PIN</label>
  <input id="code" type="password" autocomplete="new-password" inputmode="numeric" maxlength="6" autofocus />
  <label for="again">Type it again</label>
  <input id="again" type="password" autocomplete="new-password" inputmode="numeric" maxlength="6" />
  <div class="error" id="error" role="alert"></div>
  <div class="row">
    <button type="button" id="cancel">Cancel</button>
    <button type="submit" class="primary">Save</button>
  </div>
</form>
<script>
  const state = JSON.parse(new URLSearchParams(location.search).get("state") || "{}");
  if (state.change) document.getElementById("title").textContent = "Change this screen's code";
  let kind = "pin";
  const code = document.getElementById("code");
  const again = document.getElementById("again");
  const error = document.getElementById("error");
  for (const b of document.querySelectorAll("[data-kind]"))
    b.addEventListener("click", () => {
      kind = b.dataset.kind;
      for (const o of document.querySelectorAll("[data-kind]")) o.setAttribute("aria-pressed", String(o === b));
      document.getElementById("codeLabel").textContent = kind === "pin" ? "New PIN" : "New password";
      for (const i of [code, again]) {
        i.value = "";
        i.inputMode = kind === "pin" ? "numeric" : "text";
        if (kind === "pin") i.maxLength = 6;
        else i.removeAttribute("maxlength");
      }
      error.textContent = "";
      code.focus();
    });
  document.getElementById("cancel").addEventListener("click", () => window.close());
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const r = await window.warrenScreenCode.save({ kind, code: code.value, again: again.value });
    if (r?.error) {
      error.textContent = r.error;
      again.value = "";
      (r.error.includes("match") ? again : code).focus();
    }
  });
</script>
</body>
</html>
