# Generate Wisp.xcodeproj with XcodeGen: `brew install xcodegen && xcodegen` in apps/ios
name: Wisp
options:
  bundleIdPrefix: ai.wisp
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Wisp and its tests do not declare App Intents.
    LM_SKIP_METADATA_EXTRACTION: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Wisp:
    type: application
    platform: iOS
    sources: [Wisp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.wisp.ios
        PRODUCT_NAME: Wisp
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wisp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Wisp connects to Wisp on your computer over your own network.
        INFOPLIST_KEY_NSCameraUsageDescription: Wisp uses the camera to scan the pairing code on your computer.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Wisp uses the microphone so you can talk with your agents in a voice call.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Wisp turns what you say into text so your agent can answer.
        CODE_SIGN_STYLE: Automatic
        # push notifications; Xcode switches this to production when you archive for TestFlight / the App Store
        CODE_SIGN_ENTITLEMENTS: Wisp/Wisp.entitlements
    info:
      path: Wisp/Info.plist
      properties:
        CFBundleDisplayName: Wisp
        # only standard HTTPS and TLS, so App Store Connect doesn't ask about encryption on every build
        ITSAppUsesNonExemptEncryption: false
        # pairing QR codes are wisp://pair links, so the Camera app opens them in Wisp
        CFBundleURLTypes:
          - CFBundleURLName: ai.wisp.pair
            CFBundleURLSchemes: [wisp, warren]
        # self-hosted hubs are often plain http on a home network or a Tailscale address
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
  WispTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WispTests]
    dependencies:
      - target: Wisp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.wisp.WispTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Wisp.app/Wisp
        BUNDLE_LOADER: $(TEST_HOST)
  WispUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WispUITests]
    dependencies:
      - target: Wisp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.wisp.WispUITests
        TEST_TARGET_NAME: Wisp
schemes:
  Wisp:
    build:
      targets:
        Wisp: all
    test:
      targets: [WispTests, WispUITests]
      environmentVariables:
        WISP_HUB: $(WISP_HUB)
        WISP_TOKEN: $(WISP_TOKEN)
        WARREN_HUB: $(WARREN_HUB)
        WARREN_TOKEN: $(WARREN_TOKEN)
