# Generate Warren.xcodeproj with XcodeGen: `brew install xcodegen && xcodegen` in apps/ios
name: Warren
options:
  bundleIdPrefix: ai.warren
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Warren:
    type: application
    platform: iOS
    sources: [Warren]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.warren.ios
        PRODUCT_NAME: Warren
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Warren
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Warren connects to Warren on your computer over your own network.
        INFOPLIST_KEY_NSCameraUsageDescription: Warren uses the camera to scan the pairing code on your computer.
        CODE_SIGN_STYLE: Automatic
        # push notifications; Xcode switches this to production when you archive for TestFlight / the App Store
        CODE_SIGN_ENTITLEMENTS: Warren/Warren.entitlements
    info:
      path: Warren/Info.plist
      properties:
        # pairing QR codes are warren://pair links, so the Camera app opens them in Warren
        CFBundleURLTypes:
          - CFBundleURLName: ai.warren.pair
            CFBundleURLSchemes: [warren]
        # self-hosted hubs are often plain http on a home network or a Tailscale address
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
