name: Installer
# Runs install.sh the way a new user would (from this commit instead of GitHub) and checks the hub
# comes up, so the one-line install keeps working.
on:
  push:
    branches: [main]
    paths: ["install.sh", "install.ps1", "bin/**", "apps/node/src/service.ts", "apps/node/src/cli.ts", "package.json", "package-lock.json"]
  pull_request:
    paths: ["install.sh", "install.ps1", "bin/**", "apps/node/src/service.ts", "apps/node/src/cli.ts", "package.json", "package-lock.json"]
  workflow_dispatch:
jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # a pull request is checked out detached, and the installer clones whatever branch HEAD is on
      - run: git checkout -B ci
      - run: WISP_REPO="$GITHUB_WORKSPACE" bash install.sh --hub-server --no-service --dir "$RUNNER_TEMP/wisp"
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd "$RUNNER_TEMP/wisp"
          WISP_DATA_DIR="$RUNNER_TEMP/data" wisp hub start &
          for i in $(seq 30); do curl -sf localhost:4747/healthz && break; sleep 1; done
          curl -sf localhost:4747/healthz
          curl -sf localhost:4747/install.sh | head -1
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # a pull request is checked out detached, and the installer clones whatever branch HEAD is on
      - run: git checkout -B ci
      - shell: pwsh
        run: |
          $env:WISP_REPO = $env:GITHUB_WORKSPACE
          ./install.ps1 -HubServer -NoService -Dir "$env:RUNNER_TEMP\wisp"
          wisp --help
