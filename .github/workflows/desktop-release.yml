name: App release
# Push a tag like desktop-v0.2.0 to build Wisp for Mac (Apple silicon and Intel), Windows,
# Linux and Android and attach the builds to a GitHub release, marked latest. Installed apps find it there and update
# themselves (apps/desktop/src/updater.cjs). The file names never change between versions, so
# The repository's releases/latest/download/<name> URL always links the newest one.
# Macs are signed and notarized when the repository has the Apple secrets (docs/signing.md), and signed
# ad hoc without them (scripts/after-sign.cjs). Windows builds are unsigned for now.
on:
  push:
    tags: ["desktop-v*"]
env:
  GH_REPO: ${{ github.repository }}
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Wisp desktop ${GITHUB_REF_NAME#desktop-v}" --generate-notes --verify-tag --latest
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            dist: --mac --arm64
          # Intel Macs, built on Apple silicon (GitHub's Intel runners never started): the bundled
          # native modules are fetched for x64 (WISP_BUNDLE_ARCH) and electron-builder packs an x64 app
          - os: macos-15
            dist: --mac --x64
            arch: x64
          - os: windows-latest
            dist: --win --x64
          - os: ubuntu-latest
            dist: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the app's version comes from the tag
      - run: npm version "${GITHUB_REF_NAME#desktop-v}" --no-git-tag-version --allow-same-version -w @wisp/desktop
        shell: bash
      - run: npm run bundle -w @wisp/desktop
        env:
          WISP_BUNDLE_ARCH: ${{ matrix.arch }}
      - run: |
          # Only Macs get these, and only when set: electron-builder would read CSC_LINK as a Windows certificate too
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CERT" ]; then
            export CSC_LINK="$MAC_CERT" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD" APPLE_ID="$NOTARY_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$NOTARY_PASSWORD" APPLE_TEAM_ID="$NOTARY_TEAM_ID"
          fi
          npx electron-builder ${{ matrix.dist }} --publish never
        shell: bash
        working-directory: apps/desktop
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # a signed build has to pass Gatekeeper before it reaches the release
      - if: runner.os == 'macOS'
        run: |
          [ -n "$MAC_CERT" ] || { echo "No Apple secrets: this build is signed ad hoc"; exit 0; }
          app=$(find apps/desktop/dist -maxdepth 2 -iname '*.app' | head -n 1)
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
      - run: gh release upload "$GITHUB_REF_NAME" apps/desktop/dist/Wisp-* --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # signed with the debug key for now, so testers can sideload it (Play needs an upload key)
      - run: |
          V="${GITHUB_REF_NAME#desktop-v}"
          IFS=. read -r MA MI PA <<< "$V"
          ./gradlew assembleRelease -PversionName="$V" -PversionCode=$((MA * 10000 + MI * 100 + PA))
          cp app/build/outputs/apk/release/app-release.apk Wisp-android.apk
        working-directory: apps/android
      - run: gh release upload "$GITHUB_REF_NAME" apps/android/Wisp-android.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
