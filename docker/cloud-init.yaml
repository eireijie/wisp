#cloud-config
# Wisp on a new Linux server (Ubuntu 24.04 or Debian 12/13), as its first-boot "user data".
#
# It installs Docker, runs the hub (the configured Wisp image) behind Caddy and a device beside it, so
# agents live on this server and keep working when your computers are off, and gets HTTPS without a
# domain: a Let's Encrypt certificate for the server's own IP address (https://203.0.113.7), and one
# for <ip-with-dashes>.sslip.io as a second address in case the first can't be issued. The address is
# written to /opt/wisp/url and to the login message.
#
# The desktop app's "Create one in your cloud account" sends this file when it creates a server, with
# __WISP_SETUP_KEY__ replaced by a random key: until the first account exists, only a request that
# carries that key can make it, so nobody who finds the new server first can claim it. Pasted by hand
# (for example into Hetzner's or DigitalOcean's "Cloud config" box) with the placeholder left as it
# is, there's no key: the hub makes its own setup code, in /opt/wisp/data/setup-code and its log.
#
# Data lives in /opt/wisp/data, and what agents use (their AI tools, sign-ins and files) in
# /opt/wisp/device; back both up. The device sees only the second one, and the hub token it gets
# through /opt/wisp/link. The image is pulled again every night.

package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - curl

write_files:
  - path: /opt/wisp/setup-key
    permissions: "0600"
    content: "__WISP_SETUP_KEY__"

  - path: /opt/wisp/compose.yaml
    content: |
      services:
        wisp:
          image: ghcr.io/${WISP_REPO:-eireijie/wisp}:latest
          restart: unless-stopped
          environment:
            # the hub checks the setup key too, not only Caddy
            WISP_SETUP_CODE: ${WISP_SETUP_CODE:-}
            WISP_LOCAL_DEVICE_DIR: /link
          ports:
            # for the device below, on this server only
            - "127.0.0.1:4747:4747"
          volumes:
            - ./data:/data
            - ./link:/link
        # This server as a device: once the first account exists the hub hands it a token through ./link.
        # On the host's network and with the same folder path as the host, because the VMs it starts
        # are the host's Docker containers, and they mount folders and reach the hub by the host's view.
        # Not root: Claude Code refuses to run agents as root.
        device:
          image: ghcr.io/${WISP_REPO:-eireijie/wisp}:latest
          restart: unless-stopped
          command: ["node", "bin/wisp.mjs", "node", "start", "--local"]
          network_mode: host
          user: "1000:1000"
          group_add:
            - "${DOCKER_GID:-999}"
          working_dir: /app
          healthcheck:
            disable: true
          environment:
            HOME: /opt/wisp/device
            WISP_LOCAL_DEVICE_DIR: /opt/wisp/link
            # harnesses Wisp installs stay across image updates
            NPM_CONFIG_PREFIX: /opt/wisp/device/.npm-global
            PATH: /opt/wisp/device/.npm-global/bin:/opt/wisp/device/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          volumes:
            - ./device:/opt/wisp/device
            - ./link:/opt/wisp/link
            - /var/run/docker.sock:/var/run/docker.sock
        caddy:
          image: caddy:2
          restart: unless-stopped
          ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
          volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
      volumes:
        caddy-data:
        caddy-config:

  - path: /opt/wisp/start.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      # Writes the Caddyfile for this server's public IPv4 address, then starts Wisp.
      set -eu
      cd /opt/wisp

      ip="${WISP_IP-${WARREN_IP-}}"
      # the provider's metadata service (Hetzner, then DigitalOcean), else the address the server sends from
      [ -n "$ip" ] || ip=$(curl -fsS --max-time 3 http://169.254.169.254/hetzner/v1/metadata/public-ipv4 2>/dev/null || true)
      [ -n "$ip" ] || ip=$(curl -fsS --max-time 3 http://169.254.169.254/metadata/v1/interfaces/public/0/ipv4/address 2>/dev/null || true)
      [ -n "$ip" ] || ip=$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}')
      case "$ip" in
        *[!0-9.]* | "") echo "Wisp: couldn't find this server's public IPv4 address" >&2; exit 1 ;;
      esac
      sslip="$(echo "$ip" | tr . -).sslip.io"

      key=$(cat setup-key 2>/dev/null || true)
      guard=""
      printf 'WISP_REPO=eireijie/wisp\nDOCKER_GID=%s\n' "$(stat -c %g /var/run/docker.sock)" > .env
      chmod 600 .env
      # the device's user owns what it uses, and the folder it shares with the hub
      mkdir -p device link
      chown -R 1000:1000 device link
      chmod 700 device link
      case "$key" in
        "" | __WISP_SETUP_KEY__) ;;
        *) printf 'WISP_SETUP_CODE=%s\n' "$key" >> .env; guard="
        @claim {
          method POST
          path /api/setup
          not header X-Wisp-Setup-Key \"$key\"
        }
        respond @claim \"This Wisp is being set up by the app that created it.\" 403" ;;
      esac

      cat > Caddyfile <<EOF
      (wisp) {$guard
        reverse_proxy wisp:4747
      }

      # Let's Encrypt only certifies a bare IP address on its short-lived (six-day) profile; Caddy renews it.
      https://$ip {
        tls {
          issuer acme {
            profile shortlived
          }
        }
        import wisp
      }

      https://$sslip {
        import wisp
      }
      EOF

      echo "https://$ip" > url
      echo "https://$sslip" >> url
      printf '\nWisp: https://%s (also https://%s)\nData: /opt/wisp/data and /opt/wisp/device   Logs: cd /opt/wisp && docker compose logs\nSetup code (until the first account exists): cat /opt/wisp/data/setup-code\n\n' "$ip" "$sslip" > /etc/motd

      docker compose pull
      docker compose up -d
      echo "Wisp is starting at https://$ip"

  - path: /etc/cron.daily/wisp-update
    permissions: "0755"
    content: |
      #!/bin/sh
      # A hub in Docker can't update itself: get the newest image and restart on it if it changed.
      cd /opt/wisp && docker compose pull -q && docker compose up -d && docker image prune -f >/dev/null

runcmd:
  - [systemctl, enable, --now, docker]
  - [/opt/wisp/start.sh]
