<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ghost Arms</title>
<link rel="stylesheet" href="ghost-arms.css" />
<style>
  :root { --bg: #f6f5f8; --fg: #1d1d1f; --muted: #6b6b76; --card: #ffffff; --line: #e7e5ee; --ghost-shadow: oklch(0.2 0 0 / 0.14); color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #17161c; --fg: #f2f2f5; --muted: #9a99a6; --card: #201f27; --line: #2e2d38; --ghost-shadow: oklch(0 0 0 / 0.42); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #17161c; --fg: #f2f2f5; --muted: #9a99a6; --card: #201f27; --line: #2e2d38; --ghost-shadow: oklch(0 0 0 / 0.42); color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 ui-rounded, system-ui, -apple-system, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 32px 0 10px; }
  p { margin: 0; color: var(--muted); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 14px 0 6px; }
  .bar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .scroll { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
  .grid { display: grid; grid-template-columns: 92px repeat(5, 170px); gap: 10px; width: max-content; }
  .grid.small { grid-template-columns: 92px repeat(5, 120px); }
  .head { font-weight: 600; font-size: 13px; color: var(--muted); align-self: end; text-align: center; padding-bottom: 2px; }
  .row { font-weight: 600; font-size: 13px; align-self: center; }
  .row small { display: block; font-weight: 400; color: var(--muted); }
  .cell { background: var(--card); border: 1px solid var(--line); border-radius: 16px; display: grid; place-items: center; height: 196px; }
  .grid.small .cell { height: 84px; grid-auto-flow: column; gap: 12px; }
  .ghost { display: inline-grid; place-items: center; }
  .ghost svg { overflow: visible; }

  /* --- copied from apps/web/src/index.css so the preview matches the app ------------------- */
  .ghost svg g, .ghost svg circle, .ghost svg ellipse, .ghost svg text { transform-box: fill-box; }
  .ghost-float { animation: ghost-float 3.2s ease-in-out infinite; transform-origin: center bottom; }
  .ghost-float-slow { animation: ghost-float 5s ease-in-out infinite; transform-origin: center bottom; }
  .ghost-blink { animation: ghost-blink 4.6s infinite; transform-origin: center; }
  .ghost-z { animation: ghost-z 2.6s ease-in infinite; opacity: 0; }
  .ghost-z2 { animation-delay: 1.3s; }
  .ghost-ground { fill: var(--ghost-shadow); transform-origin: center; }
  @keyframes ghost-float { 0%, 100% { transform: translateY(1.5px); } 50% { transform: translateY(-4px); } }
  @keyframes ghost-blink { 0%, 90%, 100% { transform: scaleY(1); } 93% { transform: scaleY(0.12); } }
  @keyframes ghost-z { 0% { opacity: 0; transform: translate(0, 4px) scale(0.7); } 25% { opacity: 0.85; } 100% { opacity: 0; transform: translate(6px, -12px) scale(1.1); } }
  :root[data-motion="reduce"] .ghost * { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { .ghost, .ghost * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Ghost arms</h1>
  <p>Five body shapes × five moods. Hover a ghost in the Hi row to make it wave. Arms appear from 26px up.</p>
  <div class="bar">
    <label><input type="checkbox" id="still" /> Still poses (reduced motion)</label>
    <label><input type="checkbox" id="gray" /> All asleep-gray</label>
  </div>
  <div class="scroll"><div class="grid" id="big"></div></div>
  <h2>At 46px and 60px</h2>
  <div class="scroll"><div class="grid small" id="small"></div></div>
</main>
<script src="ghost-arms.js"></script>
<script>
  const SHAPES = GhostArms.SHAPES;
  const COLORS = {
    classic: ["#ff8fb8", "#d63a78"],
    round: ["#8fd3ff", "#2f6fe4"],
    tall: ["#c9b0ff", "#6f42e8"],
    sheet: ["#ffd27a", "#e5781f"],
    wisp: ["#8ef0c4", "#0f9e74"],
  };
  const ASLEEP = ["#a6aaad", "#44464a"];
  const MOODS = [
    ["awake", "Hi", "wave every 5s"],
    ["done", "Done", "cheer"],
    ["waiting", "Needs your OK", "sign"],
    ["working", "Working", "typing"],
    ["asleep", "Asleep", "offline"],
  ];

  const render = () => {
    const still = document.getElementById("still").checked;
    const gray = document.getElementById("gray").checked;
    document.documentElement.toggleAttribute("data-motion", still);
    if (still) document.documentElement.setAttribute("data-motion", "reduce");
    const keys = Object.keys(SHAPES);
    const head = `<div></div>${keys.map((k) => `<div class="head">${k}</div>`).join("")}`;
    const colorsFor = (k, mood) => (mood === "asleep" || gray ? ASLEEP : COLORS[k]);
    document.getElementById("big").innerHTML =
      head +
      MOODS.map(([mood, name, sub]) => `<div class="row">${name}<small>${sub}</small></div>` + keys.map((k) => `<div class="cell">${GhostArms.ghost({ shape: k, mood, colors: colorsFor(k, mood), size: 170, animate: !still })}</div>`).join("")).join("");
    document.getElementById("small").innerHTML =
      head +
      MOODS.map(([mood, name]) => `<div class="row">${name}</div>` + keys.map((k) => `<div class="cell">${[46, 60].map((size) => GhostArms.ghost({ shape: k, mood, colors: colorsFor(k, mood), size, animate: !still })).join("")}</div>`).join("")).join("");
  };
  document.getElementById("still").addEventListener("change", render);
  document.getElementById("gray").addEventListener("change", render);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) document.getElementById("still").checked = true;
  render();
</script>
</body>
</html>
